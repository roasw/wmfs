[pytest]
testpaths = tests
addopts = --import-mode=importlib --strict-markers
pythonpath = packages/wmfs packages/wmfs-plugin
markers =
    unit: isolated tests of Python components and local execution
    contract: behavior shared by every execution backend
    integration: tests spanning runtime, worker, RPC, and shared memory
    package: installed or generated artifact behavior
    native: native control extension behavior
