[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wmfs"
version = "0.1.0"
description = "Process-isolated scientific computing runtime prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pycapnp", "torch"]

[project.scripts]
wmfs-benchmark = "wmfs.benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["wmfs*"]

[tool.setuptools.package-data]
wmfs = ["schemas/**/*.capnp"]
