[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "wmfs"
version = "0.1.0"
description = "Process-isolated scientific computing runtime prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pycapnp", "torch>=2.1", "wmfs-plugin==0.1.0"]

[project.scripts]
wmfs-benchmark = "wmfs.benchmark:main"

[tool.scikit-build]
wheel.packages = ["packages/wmfs/wmfs"]
cmake.build-type = "Release"
install.components = ["runtime"]

[tool.scikit-build.sdist]
include = [
    "/CMakeLists.txt",
    "/README.md",
    "/version.json",
    "/inc/**",
    "/packages/wmfs/wmfs/**",
    "/packages/wmfs-plugin/wmfs_plugin/schemas/**",
    "/plugins/reference/generated/**",
    "/plugins/reference/schemas/**",
    "/src/**",
    "/tests/**",
]
exclude = ["**/__pycache__/**"]
