[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wmfs-plugin"
dynamic = ["version"]
description = "Python worker SDK for wmfs plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pycapnp", "torch>=2.1"]

[project.scripts]
wmfs-plugin-codegen = "wmfs_plugin.codegen:main"

[tool.setuptools.packages.find]
include = ["wmfs_plugin*"]

[tool.setuptools.package-data]
wmfs_plugin = ["schemas/wmfs/*.capnp"]

[tool.setuptools_scm]
fallback_version = "0.0.0+gunknown"
