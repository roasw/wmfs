[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wmfs-plugin"
version = "0.1.0"
description = "Python worker SDK for wmfs plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pycapnp", "torch>=2.1"]

[tool.setuptools.packages.find]
include = ["wmfs_plugin*"]

[tool.setuptools.package-data]
wmfs_plugin = ["schemas/wmfs/*.capnp"]
