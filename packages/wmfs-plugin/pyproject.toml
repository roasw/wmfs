[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wmfs-plugin"
dynamic = ["version"]
description = "Python SDK for bundled and isolated wmfs plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
include = ["wmfs_plugin*"]

[tool.setuptools_scm]
fallback_version = "0.0.0+gunknown"
