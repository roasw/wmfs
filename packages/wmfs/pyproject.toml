[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "wmfs"
version = "0.1.0"
description = "Process-isolated scientific computing runtime prototype"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pycapnp", "torch>=2.1", "wmfs-plugin==0.1.0"]

[project.scripts]
wmfs-benchmark = "wmfs.benchmark:main"

[tool.scikit-build]
wheel.packages = ["wmfs"]
cmake.build-type = "Release"
cmake.source-dir = "../.."
install.components = ["runtime"]
