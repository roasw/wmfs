[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wmfs-reference"
dynamic = ["version"]
description = "Reference numerical plugin for wmfs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
include = ["wmfs_reference*"]

[tool.setuptools.data-files]
"share/wmfs/plugins/reference/generated/include/wmfs" = [
    "generated/include/wmfs/plugin_abi.h",
    "generated/include/wmfs/reference_plugin.hpp",
]
"share/wmfs/plugins/reference/generated/python/wmfs_reference" = [
    "generated/python/wmfs_reference/interface.py",
    "generated/python/wmfs_reference/interface.pyi",
]
"share/wmfs/plugins/reference/generated/src" = [
    "generated/src/reference_plugin_stub.cpp",
]
"share/wmfs/plugins/reference/generated" = [
    "generated/manifest.json",
]
"share/wmfs/plugins/reference/schemas/wmfs-reference" = [
    "schemas/wmfs-reference/reference.capnp",
]

[tool.setuptools_scm]
fallback_version = "0.0.0+gunknown"
