[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wmfs-reference"
version = "0.1.0"
description = "Reference numerical plugin for wmfs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "wmfs-plugin==0.1.0"]

[project.scripts]
wmfs-reference-worker = "wmfs_reference.worker:main"

[tool.setuptools.packages.find]
include = ["wmfs_reference*"]

[tool.setuptools.data-files]
"share/wmfs/plugins/reference" = ["plugin.toml"]
"share/wmfs/plugins/reference/schemas/wmfs-reference" = [
    "schemas/wmfs-reference/reference.capnp",
]
