[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wmfs-reference"
dynamic = ["version"]
description = "Reference numerical plugin for wmfs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "wmfs-plugin"]

[project.scripts]
wmfs-reference-worker = "wmfs_reference.worker:main"

[tool.setuptools.packages.find]
include = ["wmfs_reference*"]

[tool.setuptools.data-files]
"share/wmfs/plugins/reference" = ["plugin.toml"]
"share/wmfs/plugins/reference/schemas/wmfs-reference" = [
    "schemas/wmfs-reference/reference.capnp",
]

[tool.setuptools_scm]
fallback_version = "0.0.0+gunknown"
