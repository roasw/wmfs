format_version = 2
abi_version = 1
protocol_version = 11

[plugin]
name = "reference"
version = "0.1.0"
namespace = "reference"
python_module = "wmfs_reference"

[deployment]
schema = "../schemas/wmfs-reference/reference.capnp"
interface = "ReferencePlugin"
root = ".."
worker = "wmfs-reference-worker"
local_provider = "wmfs_reference.kernels"
bundled_namespace = "wmfs_reference"

[lifecycle]
initialize = true
shutdown = true

[configuration]
schema_version = 1
type = "object"
description = "Initialization settings for the reference numerical plugin."
additional_properties = false

[configuration.properties.threads]
type = "integer"
description = "Maximum number of kernel threads."
default = 1
minimum = 1
maximum = 64

[configuration.properties.precision]
type = "string"
description = "Numerical precision policy for supported kernels."
default = "balanced"
enum = ["fast", "balanced", "accurate"]
min_length = 4
max_length = 8

[configuration.properties.emit_diagnostics]
type = "boolean"
description = "Enable plugin diagnostic records when logging is available."
default = false

[configuration.properties.tags]
type = "array"
description = "Bounded labels attached to diagnostic records."
default = []
min_items = 0
max_items = 8
items = { type = "string", min_length = 1, max_length = 24 }

[configuration.properties.solver]
type = "object"
description = "SVD solver controls."
additional_properties = false
required = ["algorithm"]

[configuration.properties.solver.properties.algorithm]
type = "string"
description = "SVD algorithm family."
enum = ["divideAndConquer", "qrIteration"]

[configuration.properties.solver.properties.tolerance]
type = "number"
description = "Relative convergence tolerance."
default = 1.0e-7
minimum = 0.0
maximum = 1.0

[configuration.examples.conservative]
threads = 1
precision = "accurate"
emit_diagnostics = false
tags = ["production"]
solver = { algorithm = "qrIteration", tolerance = 1.0e-10 }

[configuration.examples.throughput]
threads = 8
precision = "fast"
solver = { algorithm = "divideAndConquer" }

[[enums]]
name = "IndexOrder"
values = ["rowMajor", "columnMajor"]

[[operations]]
id = 1
name = "matmul"

[[operations.dtype_variables]]
name = "T"
dtypes = ["float32", "float64", "int64", "uint8"]

[[operations.inputs]]
name = "a"
dtype = { variable = "T" }

[[operations.inputs]]
name = "b"
dtype = { variable = "T" }

[[operations.outputs]]
name = "result"
dimensions = [
  { input_axis = { input = 0, axis = 0 } },
  { input_axis = { input = 1, axis = 1 } },
]
dtype = { variable = "T" }

[operations.vjp]
operation_id = 4
saved_inputs = [0, 1]
output_cotangents = [0]
input_gradients = [0, 1]

[[operations]]
id = 2
name = "svd"

[[operations.dtype_variables]]
name = "T"
dtypes = ["float32", "float64"]

[[operations.inputs]]
name = "a"
dtype = { variable = "T" }

[[operations.scalars]]
