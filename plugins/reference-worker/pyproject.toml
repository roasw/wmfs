[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wmfs-reference-worker"
dynamic = ["version"]
description = "Isolated Python worker composition for wmfs-reference"
requires-python = ">=3.11"
dependencies = ["wmfs-plugin", "wmfs-reference"]

[project.scripts]
wmfs-reference-worker = "wmfs_reference_worker:main"

[tool.setuptools]
py-modules = ["wmfs_reference_worker"]

[tool.setuptools_scm]
fallback_version = "0.0.0+gunknown"
